services:
  mongo:
    image: mongo:7.0
    container_name: opportunityloop-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: opportunityloop-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/opportunityloop
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-dev-secret-change-in-production-32chars}
      SESSION_TTL_DAYS: 7
      REMINDER_INTERVAL_MINUTES: 60
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-OpportunityLoop <no-reply@example.com>}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: opportunityloop-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  mongo_data:

